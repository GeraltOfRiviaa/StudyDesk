services:
  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  api:
    env_file: .env.local
    command: uvicorn main:app --host 0.0.0.0 --port 80 --reload
    build: ./backend
    ports:
      - "8000:80"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
        - action: rebuild
          path: ./backend/requirements.txt
    environment:
      - MONGO_URL=mongodb://mongodb:27017/?directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - studydesk:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s


volumes:
  studydesk:
