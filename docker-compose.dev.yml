services:
  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  api:
    env_file: .env.local
    command: uvicorn main:app --host 0.0.0.0 --port 80 --reload
    build: ./backend
    ports:
      - "8000:80"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
        - action: rebuild
          path: ./backend/requirements.txt
    environment:
      - MONGO_URL=mongodb://mongodb:27017/?directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongodb/mongodb-community-server:latest
    command: ["mongod", "--config", "/etc/mongod.conf"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - studydesk:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongodb/mongodb-community-server:latest
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./passwordFile:/passwordFile:ro
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb --quiet --eval "
          const a = db.getSiblingDB('admin');
          if (!a.getUser('Myrril')) {
            a.createUser({ user: 'Myrril', pwd: '$$(cat /passwordFile)', roles: ['searchCoordinator'] });
          }
        "

  mongot:
    image: mongodb/mongodb-community-search:latest
    container_name: mongot
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "9946:9946"
    volumes:
      - mongot-data:/data/mongot
      - ./mongot.conf:/mongot-community/config.default.yml:ro
      - ./passwordFile:/passwordFile:ro

volumes:
  studydesk:
  mongot-data:
