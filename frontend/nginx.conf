server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Only these BrowserRouter pages receive the SPA entry point. /library
    # also names an API route, so require an HTML navigation request.
    location ~ ^/(login|register|library|settings(/change/password)?)/?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        if ($http_accept !~* "text/html") { return 404; }
        try_files /index.html =404;
    }
}
